# separate terms of service, privacy policy, and support
# documentation.

name: 2 - Deploy to QA


on:
  push:
    branches: [ "develop" ]
  workflow_dispatch: 
    inputs:
      branch:
        description: 'Branch alvo para deploy (ex: develop, ci/#10-implement-pipeline-workflow, etc.).'
        required: true
        default: 'develop'
        type: string


env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # Environment prefix for Parameter Store (dev, qa, prod)
  ENVIRONMENT: qa


jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: ver
        run: echo "VERSION=$(date +'%Y.%m.%d.%H%M')" >> $GITHUB_ENV

      # Extract metadata (tags, labels) for Docker - same as in build job
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 1) Environment-specific latest
            type=raw,value=qa-latest
            # 2) CalVer release vYYYY.mm.dd.HHMM
            type=raw,value=${{ env.VERSION }}   # 2025.06.12.1543
            # 3) Environment-specific CalVer
            type=raw,value=qa-${{ env.VERSION }}
            # 4) Branch
            type=ref,event=branch               # dev, feature-foo
            # 5) Pull-request
            type=ref,event=pr                   # pr-123

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Push Docker image
        id: push
        if: success()
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    runs-on: ubuntu-latest
    needs: [ push ]
    environment: qa
    if: success()
    concurrency:
      group: deploy-qa
      cancel-in-progress: true
    env:
      # Port for Wakanda AI application
      WAKAX_PORT: ${{ vars.WAKAX_PORT }}
      # Environment prefix for Parameter Store (dev, staging, prod)
      ENVIRONMENT: qa
      # Parameter Store path - será construído dinamicamente com o prefixo do ambiente
      AWS_PARAMETER_STORE_IMPORT: aws-parameterstore:/config/wakax/qa/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Copy files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "./docker-compose.qa.yml"
          target: "~/actions-runner-qa"

      - name: Deploy to QA EC2
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          ENVIRONMENT: qa
          WAKAX_PORT: ${{ env.WAKAX_PORT }}
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          AWS_PARAMETER_STORE_IMPORT: ${{ env.AWS_PARAMETER_STORE_IMPORT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_NAME,ENVIRONMENT,WAKAX_PORT,HEALTH_URL,AWS_PARAMETER_STORE_IMPORT,GITHUB_TOKEN,GITHUB_ACTOR
          script_path: .github/scripts/deploy-prod.sh

      - name: Healthcheck
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          ENVIRONMENT: qa
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_NAME,ENVIRONMENT
          script_path: .github/scripts/deploy-healthcheck.sh
