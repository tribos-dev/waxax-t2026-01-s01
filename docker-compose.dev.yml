services:
  postgres_container:
    # Banco de dados para desenvolvimento local do WakaX (ERP)
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wakaxdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
