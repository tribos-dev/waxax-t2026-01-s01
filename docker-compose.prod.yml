# ATENÇÃO!
# Este arquivo é essencial para o deploy da aplicação,
# qualquer alteração feita aqui irá impactar diretamente no funcionamento do CI/CD e da aplicação em produção.
services:
  wakax:
    container_name: wakax-prod
    image: ghcr.io/${IMAGE_NAME}:prod-latest
    ports:
      - "${WAKAX_PORT}:8080"
    environment:
      - AWS_PARAMETER_STORE_IMPORT=${AWS_PARAMETER_STORE_IMPORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "${HEALTH_URL}"]
      start_period: 60s
      interval: 30s
      timeout: 5s
      retries: 3
      disable: false
    restart: unless-stopped